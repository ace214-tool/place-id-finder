<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Place ID讀懃ｴ｢</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#333a45; --sub:#8a919c; --line:#e3e6eb;
    --blue:#3a82f7; --blue-dark:#2f6fdb; --green:#22b14c; --orange:#f5a623; --red:#e5484d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Meiryo","Hiragino Sans","Noto Sans JP",sans-serif;font-size:13px;line-height:1.6}
  main{max-width:720px;margin:0 auto;padding:24px 16px 80px}
  .card{background:var(--card);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px;margin-bottom:16px}
  h1{font-size:15px;font-weight:700;margin:0 0 2px}
  .lead{color:var(--sub);margin:0 0 14px;font-size:12px}
  form{display:flex;gap:8px}
  input[type=text]{flex:1;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  input[type=text]:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(58,130,247,.15)}
  input::placeholder{color:#b5bac2}
  button{font-size:13px;font-weight:600;padding:0 22px;border:0;border-radius:6px;background:var(--blue);color:#fff;cursor:pointer;font-family:inherit;transition:background .15s}
  button:hover{background:var(--blue-dark)}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue);padding:4px 12px;font-size:12px;border-radius:14px}
  button.ghost:hover{background:var(--blue);color:#fff}
  button.ghost.done{background:var(--green);border-color:var(--green);color:#fff}
  .hint{color:var(--sub);font-size:11px;margin:10px 0 0}
  .status{font-size:12px;color:var(--sub);margin:0 0 10px;min-height:20px}
  .status.err{color:var(--red);font-weight:600}
  .row{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .num{flex:0 0 26px;height:26px;border-radius:50%;background:#eef3fc;color:var(--blue);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .info{flex:1;min-width:0}
  .name{font-weight:700;font-size:14px}
  .addr{color:var(--sub);font-size:12px}
  .pid{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
  code{font-family:Consolas,"Courier New",monospace;font-size:12px;background:#f4f5f7;border:1px solid var(--line);border-radius:4px;padding:3px 8px;word-break:break-all}
  .tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:3px;border:1px solid;margin-left:6px;vertical-align:middle;font-weight:600}
  .tag.closed{color:var(--red);border-color:var(--red)}
  .tag.temp{color:var(--orange);border-color:var(--orange)}
  .empty{padding:28px 0;color:var(--sub);text-align:center;font-size:12px}
  .keybox p{margin:0 0 8px;font-size:12px}
  .keybox input{width:100%;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
  .keybox .krow{display:flex;gap:8px;align-items:center}
  .keybox button.ghost{padding:7px 14px;font-size:12px;border-radius:6px}
  .keynote{font-size:11px;color:var(--sub)}
  @media (max-width:600px){ form{flex-direction:column} button{padding:11px} }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Place ID讀懃ｴ｢</h1>
    <p class="lead">繝｢繝弱ヤ繝ｼ繝ｫ逋ｻ骭ｲ逕ｨ縲ょｺ怜錐縺ｨ蟶ょ玄逕ｺ譚托ｼ医∪縺溘・鬧・錐・峨ｒ蜈･繧後※讀懃ｴ｢縲・/p>

    <div class="keybox" id="keybox" hidden>
      <p>Google Maps Platform縺ｮAPI繧ｭ繝ｼ縺梧悴險ｭ螳壹〒縺吶１laces API (New) 繧呈怏蜉ｹ縺ｫ縺励◆繧ｭ繝ｼ繧貞・蜉帙＠縺ｦ縺上□縺輔＞・医％縺ｮ繝悶Λ繧ｦ繧ｶ縺ｫ縺縺台ｿ晏ｭ倥＆繧後∪縺呻ｼ峨・/p>
      <input type="text" id="keyInput" placeholder="AIza...">
      <div class="krow">
        <button class="ghost" type="button" id="keySave">菫晏ｭ・/button>
        <span class="keynote">HTML縺ｮ API_KEY 縺ｫ逶ｴ謗･譖ｸ縺・※繧０K</span>
      </div>
    </div>

    <form id="f">
      <input type="text" id="q" placeholder="萓具ｼ壹せ繝翫ャ繧ｯ縺ｲ縺ｾ繧上ｊ 鬮伜ｴ主ｸ・ autocomplete="off" autofocus>
      <button type="submit" id="go">讀懃ｴ｢</button>
    </form>
    <p class="hint">蜷悟錐蠎励・蜿悶ｊ驕輔∴髦ｲ豁｢縺ｫ縲∝ｸょ玄逕ｺ譚代°鬧・錐縺ｾ縺ｧ蜈･繧後ｋ縺ｨ邨槭ｌ繧九ょ呵｣懊・譛螟ｧ10莉ｶ縲・/p>
  </div>

  <div class="card" id="resultCard" hidden>
    <p class="status" id="status"></p>
    <div id="result"></div>
  </div>
</main>

<script>
// 笆ｼ API繧ｭ繝ｼ繧偵％縺薙↓雋ｼ繧後・繧ｭ繝ｼ蜈･蜉帶ｬ・・蜃ｺ縺ｪ縺上↑繧具ｼ・loud蛛ｴ縺ｧHTTP繝ｪ繝輔ぃ繝ｩ蛻ｶ髯舌ｒ蠢・★險ｭ螳夲ｼ・const API_KEY = "AIzaSyB_An_8VFAAs7hhbRlmDqstZSWcRqDztm8";

const KEY_LS = "placeid_finder_apikey";
function getKey(){ return API_KEY || localStorage.getItem(KEY_LS) || ""; }

const keybox = document.getElementById("keybox");
const keyInput = document.getElementById("keyInput");
document.getElementById("keySave").onclick = () => {
  const v = keyInput.value.trim();
  if(!v) return;
  localStorage.setItem(KEY_LS, v);
  keybox.hidden = true;
  document.getElementById("q").focus();
};
if(!getKey()) keybox.hidden = false;

const form = document.getElementById("f");
const q = document.getElementById("q");
const go = document.getElementById("go");
const statusEl = document.getElementById("status");
const result = document.getElementById("result");
const resultCard = document.getElementById("resultCard");

function setStatus(msg, err=false){
  statusEl.textContent = msg;
  statusEl.className = "status" + (err ? " err" : "");
}

form.onsubmit = async (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if(!text) return;
  const key = getKey();
  if(!key){ keybox.hidden = false; setStatus("API繧ｭ繝ｼ繧定ｨｭ螳壹＠縺ｦ縺上□縺輔＞", true); return; }

  go.disabled = true;
  resultCard.hidden = false;
  setStatus("讀懃ｴ｢荳ｭ窶ｦ");
  result.innerHTML = "";

  try{
    const res = await fetch("https://places.googleapis.com/v1/places:searchText", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Goog-Api-Key": key,
        "X-Goog-FieldMask": "places.id,places.displayName,places.formattedAddress,places.businessStatus"
      },
      body: JSON.stringify({
        textQuery: text,
        languageCode: "ja",
        regionCode: "JP",
        pageSize: 10
      })
    });
    const data = await res.json();
    if(!res.ok){
      const m = data?.error?.message || res.status;
      if(String(m).includes("API key") || res.status === 403) localStorage.removeItem(KEY_LS);
      throw new Error(m);
    }
    render(data.places || []);
  }catch(err){
    setStatus("繧ｨ繝ｩ繝ｼ・・ + err.message, true);
  }finally{
    go.disabled = false;
  }
};

function render(places){
  if(!places.length){
    setStatus("");
    result.innerHTML = '<div class="empty">隧ｲ蠖薙↑縺励ょｺ怜錐縺ｮ陦ｨ險假ｼ域ｼ｢蟄暦ｼ上き繝奇ｼ上せ繝壹・繧ｹ・峨ｒ螟峨∴繧九°縲∽ｽ乗園繧定ｶｳ縺励※蜀肴､懃ｴ｢縲・/div>';
    return;
  }
  setStatus(places.length + "莉ｶ繝偵ャ繝・);
  result.innerHTML = places.map((p, i) => {
    const tag = p.businessStatus === "CLOSED_PERMANENTLY" ? '<span class="tag closed">髢画･ｭ</span>'
              : p.businessStatus === "CLOSED_TEMPORARILY" ? '<span class="tag temp">閾ｨ譎ゆｼ第･ｭ</span>' : "";
    return `<div class="row">
      <div class="num">${i+1}</div>
      <div class="info">
        <div class="name">${esc(p.displayName?.text || "")}${tag}</div>
        <div class="addr">${esc(p.formattedAddress || "")}</div>
        <div class="pid"><code>${esc(p.id)}</code><button class="ghost" type="button" data-id="${esc(p.id)}">繧ｳ繝斐・</button></div>
      </div>
    </div>`;
  }).join("");
  result.querySelectorAll("button[data-id]").forEach(b => {
    b.onclick = async () => {
      await navigator.clipboard.writeText(b.dataset.id);
      b.textContent = "繧ｳ繝斐・貂・; b.classList.add("done");
      setTimeout(() => { b.textContent = "繧ｳ繝斐・"; b.classList.remove("done"); }, 1500);
    };
  });
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
</script>
</body>
</html>
